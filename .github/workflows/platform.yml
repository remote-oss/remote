# A measurement for card #2382 (cmd-1, lib-wsl), by dispatch on this branch only: what wsl.exe and wslpath print on
# GitHub's Windows runners, with and without a registered distro, raw. No product code runs here, and no secret.
name: platform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2025:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: The probe function
        run: |
          @'
          function Probe([string] $label, [string[]] $arguments) {
            $out = New-TemporaryFile; $err = New-TemporaryFile
            $process = Start-Process -FilePath wsl.exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $bytes = [IO.File]::ReadAllBytes($out)
            "===== $label | wsl.exe $($arguments -join ' ') | exit $($process.ExitCode) | stdout $($bytes.Length) bytes"
            '--- stdout, the first 512 bytes in hex:'
            ($bytes | Select-Object -First 512 | ForEach-Object { $_.ToString('x2') }) -join ' '
            '--- stdout read as UTF-16LE:'
            [Text.Encoding]::Unicode.GetString($bytes)
            '--- stdout read as UTF-8:'
            [Text.Encoding]::UTF8.GetString($bytes)
            '--- stderr, raw bytes read as UTF-16LE then as UTF-8:'
            $errorBytes = [IO.File]::ReadAllBytes($err)
            [Text.Encoding]::Unicode.GetString($errorBytes)
            [Text.Encoding]::UTF8.GetString($errorBytes)
          }
          '@ | Set-Content "$env:RUNNER_TEMP\probe.ps1"
          "WSL_UTF8 is '$env:WSL_UTF8' (unset is the default encoding)"
      - name: (2) No distro registered
        run: |
          . "$env:RUNNER_TEMP\probe.ps1"
          Probe 'none registered' @('--list', '--verbose')
          Probe 'none registered' @('--status')
          Probe 'none registered' @('--list', '--online')
      - name: Ubuntu 24.04 installed and started once, so it is registered
        timeout-minutes: 30
        run: |
          wsl --install Ubuntu-24.04 --no-launch --web-download
          wsl -d Ubuntu-24.04 -u root -- true
          "exit $LASTEXITCODE"
      - name: (1) One distro registered
        run: |
          . "$env:RUNNER_TEMP\probe.ps1"
          Probe 'one registered' @('--list', '--verbose')
          Probe 'one registered' @('--status')
          Probe 'one registered' @('--list', '--online')
      - name: (4) wslpath with -- in Ubuntu 24.04
        run: |
          . "$env:RUNNER_TEMP\probe.ps1"
          Probe 'wslpath -u' @('-d', 'Ubuntu-24.04', '--', 'wslpath', '-u', '--', 'C:\Users')
          Probe 'wslpath -w' @('-d', 'Ubuntu-24.04', '--', 'wslpath', '-w', '--', '/home')

  windows-2022:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: (3) The same three, on a runner with no WSL
        run: |
          function Probe([string] $label, [string[]] $arguments) {
            $out = New-TemporaryFile; $err = New-TemporaryFile
            try {
              $process = Start-Process -FilePath wsl.exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru `
                -RedirectStandardOutput $out -RedirectStandardError $err -ErrorAction Stop
              $code = $process.ExitCode
            } catch {
              $code = "not started: $($_.Exception.Message)"
            }
            $bytes = [IO.File]::ReadAllBytes($out)
            "===== $label | wsl.exe $($arguments -join ' ') | exit $code | stdout $($bytes.Length) bytes"
            '--- stdout, the first 512 bytes in hex:'
            ($bytes | Select-Object -First 512 | ForEach-Object { $_.ToString('x2') }) -join ' '
            '--- stdout read as UTF-16LE:'
            [Text.Encoding]::Unicode.GetString($bytes)
            '--- stdout read as UTF-8:'
            [Text.Encoding]::UTF8.GetString($bytes)
            '--- stderr, raw bytes read as UTF-16LE then as UTF-8:'
            $errorBytes = [IO.File]::ReadAllBytes($err)
            [Text.Encoding]::Unicode.GetString($errorBytes)
            [Text.Encoding]::UTF8.GetString($errorBytes)
          }
          "where wsl.exe: $((Get-Command wsl.exe -ErrorAction SilentlyContinue).Source)"
          Probe 'windows-2022' @('--list', '--verbose')
          Probe 'windows-2022' @('--status')
          Probe 'windows-2022' @('--list', '--online')
