# A measurement for card #2365 (pkg-1, the presence bound of R-79), by dispatch on this branch only: how long
# `wsl.exe --status` and `wsl.exe --list --verbose` take on GitHub's windows-2025 runner, cold and warm. No product code
# runs here, and no secret.
name: platform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2025:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: The timing function
        run: |
          @'
          function Timed([string] $label, [string[]] $arguments) {
            $out = New-TemporaryFile; $err = New-TemporaryFile
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $process = Start-Process -FilePath wsl.exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
            $watch.Stop()
            "TIMED | $label | wsl.exe $($arguments -join ' ') | exit $($process.ExitCode) | $($watch.ElapsedMilliseconds) ms"
          }
          function Pair([string] $label) {
            Timed $label @('--status')
            Timed $label @('--list', '--verbose')
          }
          '@ | Set-Content "$env:RUNNER_TEMP\timed.ps1"
      - name: The first pair, WSL not yet started and no distro registered
        run: |
          . "$env:RUNNER_TEMP\timed.ps1"
          Pair 'first, no distro'
      - name: Ubuntu 24.04 installed and started once
        timeout-minutes: 30
        run: |
          wsl --install Ubuntu-24.04 --no-launch --web-download
          wsl -d Ubuntu-24.04 -u root -- true
          "exit $LASTEXITCODE"
      - name: Ten cold pairs, each after wsl --shutdown, each pair in fresh processes
        run: |
          . "$env:RUNNER_TEMP\timed.ps1"
          for ($i = 1; $i -le 10; $i++) {
            wsl.exe --shutdown
            Start-Sleep -Seconds 2
            Pair "cold $i"
          }
      - name: Ten warm pairs, with the distro running, for comparison
        run: |
          . "$env:RUNNER_TEMP\timed.ps1"
          Start-Process wsl.exe -WindowStyle Hidden -ArgumentList '-d', 'Ubuntu-24.04', '--', 'sleep', '600'
          Start-Sleep -Seconds 5
          for ($i = 1; $i -le 10; $i++) { Pair "warm $i" }
