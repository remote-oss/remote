# The acceptance suite with a Windows and a macOS client, on GitHub's hosted runners. On a schedule and by dispatch only,
# never on a pull request, so no fork's code reaches a hosted runner from here, and with no secret.
#
# - windows-2025: the Windows client. WSL2 gives the Linux side: an Ubuntu 24.04 distro whose Docker engine runs the
#   SSH hosts and the dev containers (the Windows engine of the image runs Windows containers only). The launches
#   reach that engine through tools/engine-stand-in.ts on 127.0.0.1, which forwards to the distro's own address and
#   takes the client's drive paths as bind sources, as Docker Desktop's engine does, so the job's containers rows run
#   against that stand-in for Docker Desktop (reading-2511-desktop-stand-in); the other steps reach it at the distro's
#   address. The hosts' and containers' published ports are reached over WSL2's localhost forwarding.
#   VSCodium answers on its debugging port there.
# - macos-15-intel: the macOS client, with colima's Docker for linux/x86_64 (about 10 minutes to start).
#
# Each job runs `node tools/acceptance.ts --editor vscodium` for its launch list and leaves the run's summary in the job
# summary. The run folder holds keys, so it is never uploaded.
name: platform

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      windows-launches:
        description: The launches of the Windows job, joined by commas; none skips the job
        type: string
        default: containers-a,containers-b,containers-trust,local,remote
      macos-launches:
        description: The launches of the macOS job, joined by commas; none skips the job
        type: string
        default: containers-a,containers-b,containers-trust,local,remote

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'schedule' || inputs.windows-launches != 'none'
    runs-on: windows-2025
    timeout-minutes: 240
    concurrency:
      group: platform-windows-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      LAUNCHES: ${{ inputs.windows-launches || 'containers-a,containers-b,containers-trust,local,remote' }}
      WSL_UTF8: '1'
    steps:
      # the host images and their scripts are built in the WSL engine from this checkout, so they keep the repository's
      # LF line ends: a CRLF shell script would end the host's entrypoint at once
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The Linux side, an Ubuntu distro in WSL2 with its own Docker engine
        timeout-minutes: 30
        run: |
          wsl --install Ubuntu-24.04 --no-launch --web-download
          wsl -d Ubuntu-24.04 -u root -- sh -c 'apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io docker-buildx 2>&1 | tail -2'
          # a wsl.exe that stays, so the distro, its address and its engine outlive this step
          Start-Process wsl.exe -WindowStyle Hidden -ArgumentList '-d', 'Ubuntu-24.04', '--', 'sleep', 'infinity'
          # the distro's own address on WSL's virtual switch, which only this runner reaches; anything but a private
          # address ends the job, since the engine's API is unauthenticated and root
          $engine = (wsl -d Ubuntu-24.04 --exec hostname -I).Trim().Split(' ')[0]
          if ($engine -notmatch '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)') { "the distro's address $engine is not private"; exit 1 }
          # in NAT mode only: mirrored mode shares the host's interfaces, so the address would no longer be host-only
          $networking = (wsl -d Ubuntu-24.04 --exec wslinfo --networking-mode).Trim()
          if ($networking -ne 'nat') { "WSL's networking mode is '$networking', not nat"; exit 1 }
          # the packaged service (Ubuntu under WSL runs systemd), with a TCP listener on that address alone. The Windows
          # CLI reaches it there directly: through WSL2's localhost forwarding a `docker run`'s attached output was lost
          # while its exit status came through (#2505)
          $unit = "[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://${engine}:2375 --containerd=/run/containerd/containerd.sock\n"
          wsl -d Ubuntu-24.04 -u root -- sh -c "mkdir -p /etc/systemd/system/docker.service.d && printf '$unit' > /etc/systemd/system/docker.service.d/tcp.conf && systemctl daemon-reload && systemctl restart docker && systemctl is-active docker"
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep 2
            docker -H "tcp://${engine}:2375" version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}' 2>$null
            $up = $LASTEXITCODE -eq 0
          }
          if (-not $up) { wsl -d Ubuntu-24.04 -u root -- sh -c 'systemctl status docker --no-pager | tail -15'; exit 1 }
          "DOCKER_HOST=tcp://${engine}:2375" >> $env:GITHUB_ENV
      # the image's Docker CLI has no buildx plugin, and the harness builds its images with `docker build --load`
      - name: Docker's buildx plugin for the Windows CLI
        run: |
          $plugins = Join-Path $env:USERPROFILE '.docker\cli-plugins'
          New-Item -ItemType Directory -Force $plugins | Out-Null
          $exe = Join-Path $plugins 'docker-buildx.exe'
          Invoke-WebRequest 'https://github.com/docker/buildx/releases/download/v0.38.0/buildx-v0.38.0.windows-amd64.exe' -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'b39784aed5b3f9b24d1971bbcbad8c8206033fa63ed4fea82c9141728fe0ea26') { "docker-buildx.exe has sha256 $hash, not its pin"; exit 1 }
          docker buildx version
      # the run's download host listens on the Windows side's WSL adapter, where the distro's containers reach it: inbound
      # to Node on that adapter only
      - name: The download host is reached from the WSL distro
        run: New-NetFirewallRule -DisplayName 'acceptance download host from WSL' -Direction Inbound -Program (Get-Command node).Source -InterfaceAlias 'vEthernet (WSL*)' -Action Allow | Out-Null
      # The image's OpenSSH for Windows, whose agent is a service on a named pipe (disabled until a job starts it); the
      # run's keys go into it and the run takes them out again.
      - name: The OpenSSH client and its agent service
        run: |
          Get-Command ssh, ssh-keygen, ssh-agent, ssh-add, env -All -ErrorAction SilentlyContinue | Format-Table -AutoSize Name, Source
          ssh -V
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent | Format-Table -AutoSize Name, Status, StartType
      # Docker Desktop's engine takes a Windows client's drive paths as bind sources, and the distro's engine does not,
      # so the launches reach it through a stand-in on 127.0.0.1 that rewrites them to the distro's /mnt paths and logs
      # each rewrite (reading-2511-desktop-stand-in). A process started in one step is gone by the next, so the stand-in
      # lives in this step, and the other steps use the engine's own address.
      - name: The launches
        run: |
          $addressFile = Join-Path $env:RUNNER_TEMP 'engine-stand-in.address'
          $standInLog = Join-Path $env:RUNNER_TEMP 'engine-stand-in.log'
          $standIn = Start-Process node -PassThru -NoNewWindow -RedirectStandardOutput $standInLog -RedirectStandardError "$standInLog.err" -ArgumentList (Join-Path $env:GITHUB_WORKSPACE 'tools/engine-stand-in.ts'), '--engine', $env:DOCKER_HOST, '--address-file', $addressFile
          # the file exists a moment before the address is in it, so the wait is for the address itself
          $address = ''
          for ($i = 0; $i -lt 30 -and $address -notmatch '^tcp://127\.0\.0\.1:\d+$'; $i++) {
            Start-Sleep 1
            $address = "$(Get-Content $addressFile -Raw -ErrorAction SilentlyContinue)".Trim()
          }
          if ($address -notmatch '^tcp://127\.0\.0\.1:\d+$') { "no stand-in address in $addressFile`: '$address'"; Get-Content $standInLog, "$standInLog.err" -ErrorAction SilentlyContinue; exit 1 }
          $engine = $env:DOCKER_HOST
          $env:DOCKER_HOST = $address
          "the engine stand-in: $env:DOCKER_HOST, in front of $engine"
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'
          if ($LASTEXITCODE -ne 0) { Get-Content $standInLog, "$standInLog.err" -ErrorAction SilentlyContinue; exit 1 }
          pnpm test:acceptance:vscodium --launches $env:LAUNCHES
          $launched = $LASTEXITCODE
          Stop-Process -InputObject $standIn -ErrorAction SilentlyContinue
          "the engine stand-in's log, every bind source it rewrote among it:"
          Get-Content $standInLog, "$standInLog.err" -ErrorAction SilentlyContinue
          $rewritten = @(Select-String -Path $standInLog -SimpleMatch ' -> ').Count
          "The Windows launches ended with exit code ${launched}. Their containers rows reach the engine through tools/engine-stand-in.ts, a stand-in for Docker Desktop's engine endpoint (reading-2511-desktop-stand-in), which rewrote $rewritten bind sources to the distro's /mnt paths.`n" >> $env:GITHUB_STEP_SUMMARY
          exit $launched
      - if: always()
        run: pnpm acceptance:clean

  macos:
    if: github.event_name == 'schedule' || inputs.macos-launches != 'none'
    runs-on: macos-15-intel
    timeout-minutes: 240
    concurrency:
      group: platform-macos-${{ github.ref }}
      cancel-in-progress: false
    env:
      LAUNCHES: ${{ inputs.macos-launches || 'containers-a,containers-b,containers-trust,local,remote' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docker for linux/x86_64 through colima
        timeout-minutes: 25
        run: |
          brew install colima docker docker-buildx >/dev/null
          mkdir -p ~/.docker && printf '{"cliPluginsExtraDirs": ["%s/lib/docker/cli-plugins"]}\n' "$(brew --prefix)" > ~/.docker/config.json
          colima start --cpu 3 --memory 8
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'
          docker buildx version
      - name: The launches
        run: pnpm test:acceptance:vscodium --launches "$LAUNCHES"
      - if: always()
        run: pnpm acceptance:clean
