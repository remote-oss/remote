# Layout, typecheck, lint, format and unit tests (ADR-0002); duplicated code, dead code and coverage (ADR-0003).
# Manual trigger until the testing ADR states the CI cost, so the private repository uses no Actions minutes by
# default.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm identifiers # the git-ignored tables every later step reads
      - run: pnpm check-layout
      - run: pnpm check-identifiers
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:shell # shellcheck is preinstalled on the runner
      - run: pnpm check-licences
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm package # vsce --no-dependencies; fails on node_modules in a VSIX (ADR-0002)

  # dupes: jscpd; dead: knip; coverage: c8 with the gates and the ratchet.
  quality:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [dupes, dead, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm identifiers
      - run: pnpm ${{ matrix.check }}

  # The editor under test against the SSH host container of tests/acceptance, one job per slice. The runner's Docker,
  # OpenSSH client and xvfb are preinstalled.
  acceptance-slice-1:
    name: acceptance (slice 1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 24.04 restricts unprivileged user namespaces, which the editor's renderer sandbox needs.
      - run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      # The run retries once inside the tool when the editor window is reported unresponsive; both attempts land in this log.
      - run: xvfb-run --auto-servernum pnpm test:acceptance

  # integration:  pnpm test:integration under xvfb, after the testing ADR
  # conformance:  per package and profile, runner in tests/conformance/runner, after the testing ADR
