name: ci
# A one-off measurement on a hosted Windows runner (never merged): what three probe lines print through OpenSSH for
# Windows' server under each DefaultShell, as raw bytes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shells:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: openssh server and a key
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-String
          }
          Start-Service sshd
          cmd /c 'ssh-keygen -q -t ed25519 -N "" -f %RUNNER_TEMP%\probe_key'
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$env:RUNNER_TEMP\probe_key.pub" | Set-Content $auth
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          "user=$env:USERNAME home=$env:USERPROFILE"
          ssh -V 2>&1
          (Get-Service sshd).Status
      - name: the probe through each default shell
        run: |
          $out = "$env:RUNNER_TEMP\probe-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          # three lines, LF endings, no BOM, as a POSIX client sends them
          [IO.File]::WriteAllText("$out\probe.txt", "echo REMOTE-OSS-PROBE-%OS%`necho REMOTE-OSS-HOME-`$HOME`necho REMOTE-OSS-PROBE-DONE`n")
          New-Item -Path 'HKLM:\SOFTWARE\OpenSSH' -Force | Out-Null
          $shells = [ordered]@{
            'cmd' = 'C:\Windows\System32\cmd.exe'
            'powershell' = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
            'pwsh' = 'C:\Program Files\PowerShell\7\pwsh.exe'
          }
          foreach ($name in $shells.Keys) {
            New-ItemProperty -Path 'HKLM:\SOFTWARE\OpenSSH' -Name DefaultShell -Value $shells[$name] -PropertyType String -Force | Out-Null
            Restart-Service sshd
            Start-Sleep 2
            # cmd's own redirection keeps the bytes as they come (pwsh's would re-encode them)
            cmd /c "ssh -T -i %RUNNER_TEMP%\probe_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new %USERNAME%@localhost < `"$out\probe.txt`" > `"$out\$name.out`" 2> `"$out\$name.err`""
            "=== $name (DefaultShell $($shells[$name])) exit=$LASTEXITCODE bytes=$((Get-Item "$out\$name.out").Length)"
            Format-Hex -Path "$out\$name.out" | Out-String -Width 120
            "--- stderr:"
            Get-Content "$out\$name.err" -Raw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-shell-probe
          path: ${{ runner.temp }}/probe-out/
