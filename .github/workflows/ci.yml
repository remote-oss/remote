# The acceptance suite with a Windows and a macOS client, on GitHub's hosted runners (card platform-01, #1966; ADR-0013
# decision 6). On a schedule and by dispatch only, never on a pull request (D-93), so no fork's code reaches a hosted
# runner from here, and with no secret.
#
# - windows-2025: the Windows client. WSL2 gives the Linux side: an Ubuntu 24.04 distro whose Docker engine runs the
#   SSH hosts and the dev containers, reached from Windows over WSL2's localhost forwarding (the Windows engine of the
#   image runs Windows containers only). VSCodium answers on its debugging port there (run 41467076289).
# - macos-15-intel: the macOS client, with colima's Docker for linux/x86_64 (about 10 minutes to start).
#
# Each job runs `node tools/acceptance.ts --editor vscodium` for its launch list and leaves the run's summary in the job
# summary. The run folder holds keys, so it is never uploaded.
name: ci

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      windows-launches:
        description: The launches of the Windows job, joined by commas; none skips the job
        type: string
        default: local
      macos-launches:
        description: The launches of the macOS job, joined by commas; none skips the job
        type: string
        default: local

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'schedule' || inputs.windows-launches != 'none'
    runs-on: windows-2025
    timeout-minutes: 240
    concurrency:
      group: platform-windows-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      LAUNCHES: ${{ inputs.windows-launches || 'local' }}
      WSL_UTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The Linux side, an Ubuntu distro in WSL2 with its own Docker engine
        timeout-minutes: 30
        run: |
          wsl --install Ubuntu-24.04 --no-launch --web-download
          wsl -l -v
          wsl -d Ubuntu-24.04 -u root -- sh -c 'cat /etc/wsl.conf; ps -p 1 -o comm='
          wsl -d Ubuntu-24.04 -u root -- sh -c 'apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker.io docker-buildx 2>&1 | tail -2'
          # the packaged service (Ubuntu under WSL runs systemd), with a TCP listener the Windows side reaches over WSL2's
          # localhost forwarding
          wsl -d Ubuntu-24.04 -u root -- sh -c 'mkdir -p /etc/systemd/system/docker.service.d && printf "[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock\n" > /etc/systemd/system/docker.service.d/tcp.conf && systemctl daemon-reload && systemctl restart docker && systemctl is-active docker'
          # a wsl.exe that stays, so the distro and its engine outlive this step
          Start-Process wsl.exe -WindowStyle Hidden -ArgumentList '-d', 'Ubuntu-24.04', '--', 'sleep', 'infinity'
          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep 2
            docker -H tcp://127.0.0.1:2375 version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}' 2>$null
            $up = $LASTEXITCODE -eq 0
          }
          if (-not $up) { wsl -d Ubuntu-24.04 -u root -- sh -c 'systemctl status docker --no-pager | tail -15; ss -ltnp | head'; exit 1 }
          "DOCKER_HOST=tcp://127.0.0.1:2375" >> $env:GITHUB_ENV
      - name: Probe, the client address a container reaches (card tooling-116)
        continue-on-error: true
        run: |
          $route = (wsl -d Ubuntu-24.04 -u root -- ip -4 route show default) -join ' '
          $gw = ($route.Trim() -split '\s+')[2]
          "distro default gateway (the Windows host as the distro sees it): $gw"
          Get-NetIPAddress -AddressFamily IPv4 | Where-Object InterfaceAlias -like 'vEthernet*' | ForEach-Object { "windows adapter $($_.InterfaceAlias): $($_.IPAddress)" }
          New-NetFirewallRule -DisplayName 'tooling-116 probe' -Direction Inbound -Protocol TCP -LocalPort 47116 -InterfaceAlias 'vEthernet (WSL*)' -Action Allow | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\serve" | Out-Null
          'probe-ok' | Set-Content "$env:RUNNER_TEMP\serve\probe.txt"
          $srv = Start-Process python -PassThru -WindowStyle Hidden -ArgumentList '-m', 'http.server', '47116', '--bind', $gw, '--directory', "$env:RUNNER_TEMP\serve"
          Start-Sleep 3
          "listening: $(Get-NetTCPConnection -LocalPort 47116 -State Listen -ErrorAction SilentlyContinue | ForEach-Object LocalAddress)"
          docker run --rm --add-host "downloads:$gw" alpine:3.22 wget -qO- -T 10 http://downloads:47116/probe.txt
          "container fetch exit=$LASTEXITCODE"
          wsl -d Ubuntu-24.04 -u root -- sh -c "wget -qO- -T 10 http://${gw}:47116/probe.txt; echo distro fetch exit=`$?"
          Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
      - name: The launches
        run: pnpm test:acceptance:vscodium --launches $env:LAUNCHES
      - if: always()
        run: pnpm acceptance:clean

  macos:
    if: github.event_name == 'schedule' || inputs.macos-launches != 'none'
    runs-on: macos-15-intel
    timeout-minutes: 240
    concurrency:
      group: platform-macos-${{ github.ref }}
      cancel-in-progress: false
    env:
      LAUNCHES: ${{ inputs.macos-launches || 'local' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docker for linux/x86_64 through colima
        timeout-minutes: 25
        run: |
          brew install colima docker docker-buildx >/dev/null
          mkdir -p ~/.docker && printf '{"cliPluginsExtraDirs": ["%s/lib/docker/cli-plugins"]}\n' "$(brew --prefix)" > ~/.docker/config.json
          colima start --cpu 3 --memory 8
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}'
          docker buildx version
      - name: Probe, the client address a container reaches (card tooling-116)
        continue-on-error: true
        run: |
          echo "inside the VM: $(colima ssh -- getent hosts host.lima.internal)"
          docker run --rm alpine:3.22 sh -c 'getent hosts host.lima.internal; getent hosts host.docker.internal; ip route' || true
          addr=$(colima ssh -- getent hosts host.lima.internal | awk '{print $1}')
          echo "host.lima.internal = $addr"
          mkdir -p "$RUNNER_TEMP/serve" && echo probe-ok > "$RUNNER_TEMP/serve/probe.txt"
          python3 -m http.server 47116 --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" >"$RUNNER_TEMP/serve.log" 2>&1 &
          srv=$!; sleep 3
          echo "host fetch: $(curl -s -m 5 http://127.0.0.1:47116/probe.txt) (listener pid $srv: $(kill -0 $srv && echo alive))"
          colima ssh -- sh -c "wget -qO- -T 10 http://$addr:47116/probe.txt; echo vm fetch exit=\$?" || true
          docker run --rm --add-host "downloads:$addr" alpine:3.22 wget -qO- -T 10 http://downloads:47116/probe.txt; echo "container fetch (loopback listener) exit=$?"
          echo "--- a listener on every interface, for comparison (this probe only)"
          kill $srv; python3 -m http.server 47117 --bind 0.0.0.0 --directory "$RUNNER_TEMP/serve" >/dev/null 2>&1 &
          srv=$!; sleep 3
          docker run --rm --add-host "downloads:$addr" alpine:3.22 wget -qO- -T 10 http://downloads:47117/probe.txt; echo "container fetch (wildcard listener) exit=$?"
          kill $srv; cat "$RUNNER_TEMP/serve.log" | tail -5
          colima list
      - name: The launches
        run: pnpm test:acceptance:vscodium --launches "$LAUNCHES"
      - if: always()
        run: pnpm acceptance:clean
