# Layout, typecheck, lint, format and unit tests (ADR-0002); duplicated code, dead code and coverage (ADR-0003).
# Triggers (athena on #142, ruling 4): every pull request from this repository runs the checks and the cheap acceptance
# jobs (slice 1, server lifecycle) at its head, so that "passing in CI" means the head, not the last dispatch. The
# costly jobs (real server, the whole VSCodium suite, host variants) stay opt-in on a manual dispatch, and always run on
# the tag of a release (`<package>-v<semver>`). A pull request runs the VSCodium launches its change selects, up to six
# (acceptance-pr). Every push to main runs the VSCodium launches the merged change can reach (the post-merge run), and
# the schedule runs all of them: the backstops for main's launches. The
# VSCodium and genuine jobs run on the self-hosted runners, and every other job on GitHub's standard runners, which use
# no Actions minutes in a public repository.
# A draft pull request runs nothing: its pushes would hold the runners while merge-ready heads wait. Marking it ready for
# review starts its run (`ready_for_review`), and that run, at the head, is the one green-at-head looks for.
name: ci

on:
  # a fork's pull request never runs: its code would run on the self-hosted runners (each job checks the head's repo);
  # nor does a draft (each job checks `draft`) until it is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      runner-arch:
        description: >-
          The architecture of the five acceptance jobs of this dispatch: slice 1, server lifecycle, host variants and
          real server on ubuntu-24.04 (X64) or ubuntu-24.04-arm (ARM64), and VSCodium on the self-hosted runners of
          that architecture. A pull request and the genuine job run on X64
        type: choice
        options: [X64, ARM64]
        default: X64
      real-server:
        description: Also install and start the real VSCodium server (about 125 MB, up to 20 minutes)
        type: boolean
        default: false
      vscodium:
        description: Also run the acceptance tests in the pinned VSCodium Insiders, a local and a remote window
        type: boolean
        default: false
      variants:
        description: Also run the host-variant rows, once per login shell and download tool of the SSH host
        type: boolean
        default: false
      launches:
        description: >-
          With vscodium, the launches to make: all, none, or labels joined by commas (for a change,
          node tools/acceptance-select.ts --base <sha> --head <sha> prints the launches it can reach)
        type: string
        default: all
      genuine:
        description: Also run the genuine launches, VS Code 1.139.1 (the recorded version) and 1.125.0 (the floor), with our VSIX, on X64
        type: boolean
        default: false
      launches-only:
        description: >-
          Run only the launches this dispatch asks for (vscodium, genuine, variants, real server): skip checks, unit,
          coverage, slice 1 and server lifecycle, which a launch's proof does not need
        type: boolean
        default: false
  # Every six hours the VSCodium job ran alone on main: the backstop that shows whether main's launches are green, which
  # PR CI never runs. It ran whole on every merge until 2026-10-20, which kept one of the eight runners busy with it
  # almost all the time; since 2026-11-02 a merge runs only the launches its change reaches (post-merge-select).
  # The six-hourly backstop ('17 */6 * * *') is paused while the self-hosted pool is down to one runner (2026-11-04):
  # its six parts would hold that runner for hours ahead of the pull requests' own launches. A dispatch with
  # vscodium and launches all runs it by hand. Once a day the genuine VS Code job runs alone on main.
  schedule:
    - cron: '43 4 * * *'
  # Each merge to main runs checks, unit and coverage, on GitHub's runners and not the self-hosted ones. Two pull
  # requests that pass alone can break each other once both are in: main shows it within minutes, not at the next pull
  # request's run.
  push:
    branches: [main]
    tags: ['*-v*']

permissions:
  contents: read

# One run per ref (a branch, or a pull request's refs/pull/<n>/merge) and kind: a new dispatch or push cancels the
# ref's older run of the same kind, so the runners do not spend their time on superseded heads. The kind (the
# real-server, vscodium and variants inputs) is part of the key, so a plain and an opt-in dispatch on one branch
# run side by side. The tag of a release is its own group and is never cancelled. A push has a group of its own per
# commit (2026-11-04): with one group for main, a run whose VSCodium parts waited for a self-hosted runner held it, and
# the newer merges' runs were replaced while pending, so their checks, unit and coverage never ran. The VSCodium parts
# keep their own groups per part, so main's parts still don't pile up.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}-${{ inputs.real-server && 'real-server' || 'plain' }}-${{ inputs.vscodium && 'vscodium' || 'vscode' }}-${{ inputs.variants && 'variants' || 'one-host' }}-${{ inputs.genuine && 'genuine' || 'no-genuine' }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'schedule' }}

jobs:
  # The jobs on GitHub's runners pin ubuntu-24.04. On 2026-10-25 ubuntu-latest moved to ubuntu-26.04, whose coreutils
  # are uutils, and a unit row that read GNU mkdir's wording turned every pull request red at once. image-canary.yml
  # runs the same checks and unit tests on ubuntu-latest once a day, so the next image move shows there first (#1379).
  # Whether a pull request changes only docs/ (no .tsv): only the checks job reads docs/ (layout, public surface,
  # coverage citations, the user guide's unit test), so the quality and acceptance jobs skip such a change and the run
  # still concludes success at its head. The diff is the merge commit's against its base parent, what the pull request
  # brings to the base it would merge into. Dispatches and tags skip this job and run everything.
  changes:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    # a git diff only, so a GitHub runner (allowed by the user, 2026-10-20) and no wait for a self-hosted one
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/[^[:space:]]*$' \
             && ! printf '%s\n' "$files" | grep -qE '\.tsv$'; then
            echo docs-only=true >> "$GITHUB_OUTPUT"
          else
            echo docs-only=false >> "$GITHUB_OUTPUT"
          fi

  # After a merge to main: the parts of the VSCodium job that the merged change can reach (acceptance-select over the
  # push's range), so that two pull requests that pass alone and break each other once both are in show red within the
  # hour, on main, rather than at the next backstop. PR CI runs no VSCodium launch, so this is the first run that meets
  # a change together with everything merged before it. GitHub keeps one pending job per part, so merges in quick
  # succession collapse into a run of the latest main, which holds each of them.
  post-merge-select:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # a git diff and the launch table only, so a GitHub runner, as the changes job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.select.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
        # A push whose `before` is no commit in this clone (all zeros, or a main rewritten by a force push) has no range
        # to select from: the output is then empty, which the VSCodium job's matrix reads as its default, every part.
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            parts=$(node tools/acceptance-select.ts --base "$BEFORE" --head "$GITHUB_SHA" --parts)
          else
            echo "::notice::the push's before ($BEFORE) is no commit here: every part runs"
            parts=''
          fi
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  checks:
    if: >-
      !inputs.launches-only && ((github.event_name != 'pull_request' && github.event_name != 'schedule') ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    # no Docker and no display: a GitHub runner (the user, 2026-10-20), so the self-hosted ones are left to acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # 5 to 7.6 min on a free runner; 10 was cut twice under load (2026-10-14)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm identifiers # the git-ignored tables every later step reads
      - run: pnpm check-layout
      - run: pnpm check-ci-gate # every job is one ci-gate needs (athena on #1076)
      - run: pnpm check-workflow-tokens # no write token on an event someone without write access can start
      - run: pnpm check-identifiers
      - run: pnpm check-consumed
        if: github.ref_type != 'tag'
      - run: node tools/identifiers.ts --consumed --release "${GITHUB_REF_NAME%-v*}"
        if: github.ref_type == 'tag'
      - run: pnpm check-public-surface
      - run: pnpm check-coverage # every acceptance criterion tagged, and every tagged one cited by a test (#142)
      - run: pnpm typecheck
      # eslint's heap is 6 GiB (package.json); the runner's cgroup cap must stay above it (8 GiB since #692)
      - run: echo "runner memory.max $(cat /sys/fs/cgroup/memory.max)"
      - run: pnpm lint
      - run: pnpm lint:shell # shellcheck is preinstalled on the runner
      # seconds each after the install above; as jobs of their own they waited minutes for a runner (2026-10-20)
      - run: pnpm dupes
      - run: pnpm dead
      - run: pnpm check-licences
      - run: pnpm format:check
      # the unit tests' temporary folders go to the job's own temporary directory, which the runner empties after every
      # job (lib-server's fake host left about 350 folders per run in /tmp and filled a runner's disk; #386 fixes the cause)
      - run: pnpm build
      - run: pnpm package # vsce --no-dependencies; fails on node_modules in a VSIX (ADR-0002)

  # dupes: jscpd; dead: knip; coverage: c8 with the gates and the ratchet.
  # The unit tests, in parallel on GitHub's runner (2026-10-20): in checks they ran one file at a time, 8.4 of its
  # 11 minutes.
  unit:
    if: >-
      !inputs.launches-only && ((github.event_name != 'pull_request' && github.event_name != 'schedule') ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the pinned pwsh and PSScriptAnalyzer, first on the PATH, for the unit rows of the PowerShell host scripts
      - run: tools/install-pwsh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # the rendered PowerShell steps use no syntax newer than Windows PowerShell 5.1
      - run: pnpm check-powershell
      - run: pnpm test:unit --parallel --jobs 4
        env:
          TMPDIR: ${{ runner.temp }}

  quality:
    name: coverage ${{ matrix.shard }}/4
    needs: changes
    if: >-
      !cancelled() && !inputs.launches-only && needs.changes.result != 'failure' && github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
      needs.changes.outputs.docs-only != 'true'))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4] # coverage.ts --shard: each unit in one shard, the four at once (2026-10-20)
    # the unit tests under coverage need no Docker and no display either: a GitHub runner, as checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # the slowest shard took 6 minutes with each unit's tests in parallel (2026-10-31, #1383)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm identifiers
      - run: tools/install-pwsh && echo "$HOME/.local/bin" >> "$GITHUB_PATH" # as the unit job
      - run: pnpm coverage --shard ${{ matrix.shard }}/4
        env:
          TMPDIR: ${{ runner.temp }} # coverage runs the unit tests; see the unit job

  # Slice 1, server lifecycle, host variants and real server run on GitHub's ubuntu-24.04, a fresh machine per job
  # (ubuntu-24.04-arm when a dispatch's runner-arch is ARM64), where all four pass; the VSCodium launches and the genuine
  # job stay on the self-hosted runners for now. Slice 1 and server lifecycle are the two of a pull request.
  # The editor under test against the SSH host container of tests/acceptance, one job per slice. The runner's Docker
  # and OpenSSH client are preinstalled, and xvfb or a display of its own.
  acceptance-slice-1:
    name: acceptance (slice 1)
    needs: changes
    if: >-
      !cancelled() && !inputs.launches-only && needs.changes.result != 'failure' && github.event_name != 'schedule' &&
      !(github.event_name == 'push' && github.ref_type == 'branch') && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
      needs.changes.outputs.docs-only != 'true'))
    runs-on: ${{ inputs.runner-arch == 'ARM64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A machine that keeps its Docker state between jobs gets what an earlier attempt of this run left removed, by
      # the run's own label; a fresh runner has nothing to remove. The same step, with `if: always()`, closes the job.
      - run: pnpm acceptance:clean
      # Ubuntu 24.04 restricts unprivileged user namespaces, which the editor's renderer sandbox needs; a kernel
      # without that AppArmor switch (the org's Fedora runners) has nothing to lift.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The run retries once inside the tool when the editor window is reported unresponsive; both attempts land in this
      # log. A runner without xvfb-run has a display of its own (DISPLAY, :99 on the org's runners). xvfb-run's own screen
      # is 640x480, where a view or a panel draws only the rows that fit and a toast may not show; the acceptance jobs
      # give it the 1920x1080 screen of :99, the size the rows are written against.
      - run: |
          if command -v xvfb-run >/dev/null; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' pnpm test:acceptance
          else
            DISPLAY=${DISPLAY:-:99} pnpm test:acceptance
          fi
      - if: always()
        run: pnpm acceptance:clean

  # The server lifecycle (probe, install, start, lock, kill, uninstall, clean-up) against a stand-in server on the same
  # SSH host container, with no editor and no download.
  acceptance-server:
    name: acceptance (server lifecycle)
    needs: changes
    if: >-
      !cancelled() && !inputs.launches-only && needs.changes.result != 'failure' && github.event_name != 'schedule' &&
      !(github.event_name == 'push' && github.ref_type == 'branch') && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
      needs.changes.outputs.docs-only != 'true'))
    runs-on: ${{ inputs.runner-arch == 'ARM64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: pnpm test:acceptance:server
      - if: always()
        run: pnpm acceptance:clean

  # The host variants (#443): the rows that depend on the host's download tool (and, later, its login shell), once per
  # variant on the same SSH host image, each variant chosen when its container starts. Part of the release gate: opt-in
  # on a dispatch (the `variants` input, default false), always on the tag of a release.
  acceptance-host-variants:
    name: acceptance (host variants)
    if: inputs.variants || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ inputs.runner-arch == 'ARM64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: pnpm build
      - run: pnpm test:acceptance:variants
      - if: always()
        run: pnpm acceptance:clean

  # The real VSCodium server for musl, installed and started on the same host: once by the host's own download, once
  # with the host's network cut so that the client downloads and copies, and once from the archive the client kept.
  # The archive (about 125 MB) is fetched twice in a run, into a folder the run removes. Every pull request's CI is a
  # manual dispatch, so the job is opt-in there (the `real-server` input, default false); the tag of a release runs it
  # always.
  acceptance-real-server:
    name: acceptance (real server)
    if: inputs.real-server || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ inputs.runner-arch == 'ARM64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: pnpm test:acceptance:real-server
      - if: always()
        run: pnpm acceptance:clean

  # A pull request from this repository runs the VSCodium launches its change selects, at most six, and a failing row
  # blocks its merge, since the gate needs this job. A larger selection gets a notice and runs by a dispatch at the head,
  # or under the acceptance-full label, here when the label is on the pull request and in acceptance-full.yml when it
  # is added.
  acceptance-pr:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    # a newer push to the pull request cancels the run of an older head, and the acceptance-full run of one; a run of
    # another event, which skips this job, gets a group of its own (its run id), so it never meets another run's
    concurrency:
      group: acceptance-pr-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    uses: ./.github/workflows/acceptance-launches.yml
    with:
      full: ${{ contains(github.event.pull_request.labels.*.name, 'acceptance-full') }}

  # The acceptance tests in the pinned VSCodium Insiders: a local window and a remote one on the
  # SSH host. The harness downloads the pinned release itself and checks its sha256, so the job needs nothing placed on
  # the runner. Opt-in on a dispatch (the `vscodium` input); the tag of a release runs it always.
  acceptance-vscodium:
    name: acceptance (vscodium, ${{ matrix.launches }})
    needs: post-merge-select
    # a merge to main runs the parts post-merge-select gives, none when its change reaches no launch. The repository
    # variable CI_POST_MERGE_VSCODIUM set to `off` skips them, so the self-hosted runners go to the pull requests' own
    # launches while they are short (2026-11-04); unset, the parts run. A release tag and a dispatch run whatever it says.
    if: >-
      !cancelled() && (inputs.vscodium || github.event.schedule == '17 */6 * * *' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_POST_MERGE_VSCODIUM != 'off' &&
      needs.post-merge-select.result == 'success' && needs.post-merge-select.outputs.parts != '[]'))
    # Every launch of the suite (`all`) runs as six parts on six runners at once: the ssh launches in two, ssh-core and
    # windows (about 40 and 30 minutes) and the rest of the group (about an hour), since the group outgrew the job's 120
    # minutes on 2026-11-02 (41428931974 was cancelled with three launches left); the two parts of the `containers`
    # launch, containers-a and containers-b, about an hour each (half the suite's files each); the other containers
    # launches; and the explorer and host-case launches together. Each runner has its own Docker daemon, so
    # the containers parts never wait for each other's lock. The genuine group
    # has its own job. A dispatch that names its launches runs them as one part; one whose launches input is empty runs
    # all.
    # Two parts at a time: the runners share one machine's memory with other work, and six VSCodium parts at once, each
    # with its editor and containers, ran it out (2026-11-03). A full run then takes three rounds of two parts.
    strategy:
      fail-fast: false
      matrix:
        launches: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.post-merge-select.outputs.parts || github.event_name == 'workflow_dispatch' && inputs.launches != 'all' && inputs.launches != '' && format('[{0}]', toJSON(inputs.launches)) || '["@ssh,!ssh-core,!windows,!cli-path","ssh-core,windows","containers-a","containers-b","@containers,!containers","@explorer,@hosts"]') }}
    # GitHub keeps one pending job per group, and a newer one replaces it. The scheduled backstop has its own group per
    # part, where only the latest main matters; each release tag has a group of its own per part, so nothing displaces it;
    # dispatches keep theirs, fed one at a time per part, so the backstop never displaces them.
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'acceptance-vscodium-main' || (github.event_name == 'push' && format('acceptance-vscodium-{0}', github.ref)) || 'acceptance-vscodium' }}-${{ matrix.launches }}
      cancel-in-progress: false
    runs-on: ${{ inputs.runner-arch == 'ARM64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # the whole VSCodium suite outgrew 60 minutes on 2026-10-20 (the first scheduled backstop, 39387179525, was cancelled
    # at 60), so it runs in parts. The containers launch alone took 44 minutes then and 83 to 110 by 2026-11-01
    # (41252320561, 41264381137, 41279176317); its two parts take about an hour each, so the limit is 120 again
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: contains(matrix.launches, 'containers')
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - if: contains(matrix.launches, '@containers') || contains(matrix.launches, 'containers-podman')
        run: tools/install-podman
      - run: tools/start-display
      # the part's launches: a group selection, or the launches a dispatch names
      - run: pnpm test:acceptance:vscodium --launches "$LAUNCHES"
        env:
          LAUNCHES: ${{ matrix.launches }}
      - if: always()
        run: pnpm acceptance:clean

  # The genuine launches: VS Code runs our VSIX with the real dialogs, at the two versions of ADR-0007: the recorded
  # version and the floor, each on its own runner. A launch the table marks `publisherDownloads` takes the server of
  # the client's own commit from the editor's publisher, and its rows accept the publisher's licence in the product's
  # own modal, as the user decided on 2026-11-01 for this job alone; the run makes such a launch only under Actions, in
  # this job (its id), with HARNESS_GENUINE_VERSION set. Every other launch uses the run's stand-in download host,
  # and the product never accepts a licence on the user's behalf. It runs on a dispatch (the `genuine`
  # input), once a day on main, and on the tag of a release, never on a pull request, and always on X64, the
  # architecture the launch is measured on. Its concurrency follows the VSCodium job's, per version: the daily run keeps
  # one group, each tag its own, and dispatches queue. ssh-no-proposals runs after genuine in the same run (the table's
  # order): the family's setup notice is told once per profile, genuine's passing probe clears an earlier "Not Now", and
  # the VSCodium no-proposals launch, which dismisses it, never shares this run. It runs at the recorded version only:
  # at the floor the editor lets Remote - SSH resolve without the proposals, and the run refuses that pair.
  # genuine-containers runs at both versions: our Dev Containers alone, against the run's stand-in licensed host, ending
  # in Cancel at the licence modal. genuine-licensed runs at both versions, after genuine: Remote - SSH in a profile of
  # its own, past the licence, with the server of the client's commit for the run's Alpine host. genuine-accept-a and -b
  # come after genuine-containers, in that order, at both versions: they accept the licence and take the publisher's
  # server, the first in one profile, the second in a fresh one that meets the first's server volume, so -b needs -a
  # earlier in the same run.
  acceptance-genuine:
    name: acceptance (genuine ${{ matrix.version }})
    if: inputs.genuine || github.event.schedule == '43 4 * * *' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.139.1
            launches: genuine,genuine-licensed,ssh-no-proposals,genuine-containers,genuine-accept-a,genuine-accept-b
          - version: 1.125.0
            launches: genuine,genuine-licensed,genuine-containers,genuine-accept-a,genuine-accept-b
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'acceptance-genuine-main' || (github.event_name == 'push' && format('acceptance-genuine-{0}', github.ref)) || 'acceptance-genuine' }}-${{ matrix.version }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Measured on the runners (2026-11-01): a leg takes about 3 minutes. One server from the publisher is 205 MiB at
    # 1.139.1 and 154 MiB at 1.125.0, and downloaded in 3 to 7 s on the runner or in a container on it. A fresh
    # profile downloads it once, and the planned launches have four such profiles at most, under a minute in all, so
    # 30 minutes keeps its margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: tools/start-display
      - run: pnpm test:acceptance:vscodium --launches "$LAUNCHES"
        env:
          HARNESS_GENUINE_VERSION: ${{ matrix.version }}
          LAUNCHES: ${{ matrix.launches }}
      - if: always()
        run: pnpm acceptance:clean

  # The one check the main ruleset requires (athena, 2026-10-19): it needs every job and runs whatever they did. A job
  # that failed or was cancelled fails it; a skipped job passes (a docs-only change, a draft, a dispatch's opt-in jobs).
  # A fork's pull request runs no CI here (every job checks the head's repo), so the gate fails it rather than passing
  # on skipped jobs. It runs on a GitHub runner (allowed by the user, 2026-10-20): it only reads the needed jobs'
  # results, so it takes no self-hosted runner, and no step of a fork's run reaches one.
  ci-gate:
    name: ci-gate
    needs:
      - changes
      - post-merge-select
      - checks
      - unit
      - quality
      - acceptance-slice-1
      - acceptance-server
      - acceptance-host-variants
      - acceptance-real-server
      - acceptance-vscodium
      - acceptance-pr
      - acceptance-genuine
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The needed jobs' results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes post-merge-select checks unit quality slice-1 server host-variants real-server vscodium pr-launches genuine: $RESULTS"
      - name: A failed or cancelled job, or a fork's pull request, fails the gate
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo 'refused: a needed job failed or was cancelled, or this is a fork'"'"'s pull request (no CI runs for forks)' >&2
          exit 1

  # integration:  pnpm test:integration under xvfb, after the testing ADR
  # per-package checks by profile: added in a later change
