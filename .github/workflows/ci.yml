name: ci
# A one-off first job on the Mac mini runner (never merged): whether Apple's container CLI works from the runner's
# LaunchDaemon, which runs as labci in the system domain with no login session. Nothing here reads outside labci's home.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: [remote-labs-apple]
    timeout-minutes: 30
    steps:
      - name: who and where
        run: |
          id; sw_vers -productVersion; uname -m; echo "HOME=$HOME"; echo "PATH=$PATH"
          launchctl manageruid 2>/dev/null || true
          /usr/local/bin/container --version
      - name: the container system for labci
        run: |
          /usr/local/bin/container system status || true
          /usr/local/bin/container system start --enable-kernel-install
          /usr/local/bin/container system status
      - name: a public image runs
        run: |
          /usr/local/bin/container run --rm docker.io/library/alpine:3.22 uname -a
          /usr/local/bin/container image list
