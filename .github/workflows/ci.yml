name: ci
# A one-off probe of GitHub's hosted runners for the Windows, macOS and arm64 work (never merged).
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TAG: 1.140.06829-insider
  RELEASES: https://github.com/VSCodium/vscodium-insiders/releases/download
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: machine
        run: |
          uname -a; nproc; free -g | head -2; df -h / | tail -1
          lscpu | grep -E 'Model name|Virtualization|Hypervisor' || true
          node --version; docker info --format '{{.ServerVersion}} {{.OSType}}/{{.Architecture}}' || true
      - name: kvm
        continue-on-error: true
        run: |
          ls -l /dev/kvm || { echo "no /dev/kvm"; exit 0; }
          sudo chmod 666 /dev/kvm
          python3 -c 'import fcntl,os; fd=os.open("/dev/kvm",os.O_RDWR); print("KVM_GET_API_VERSION", fcntl.ioctl(fd,0xAE00))'

  windows:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, windows-2022]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: machine
        run: |
          $os = Get-CimInstance Win32_OperatingSystem; "$($os.Caption) $($os.Version)"
          $cs = Get-CimInstance Win32_ComputerSystem; "model=$($cs.Model) hypervisorPresent=$($cs.HypervisorPresent) memGB=$([math]::Round($cs.TotalPhysicalMemory/1GB,1))"
          Get-CimInstance Win32_Processor | ForEach-Object { "$($_.Name) cores=$($_.NumberOfLogicalProcessors) vmFirmware=$($_.VirtualizationFirmwareEnabled) slat=$($_.SecondLevelAddressTranslationExtensions)" }
          Get-PSDrive C | ForEach-Object { "C: free GB=$([math]::Round($_.Free/1GB))" }
          "user=$env:USERNAME session=$((Get-Process -Id $PID).SessionId) interactive=$([Environment]::UserInteractive)"
          "explorer running: $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
          node --version; git --version; ssh -V 2>&1
          docker version --format '{{.Server.Os}}/{{.Server.Arch}} {{.Server.Version}}' 2>&1
          exit 0
      - name: optional features
        continue-on-error: true
        run: |
          foreach ($f in 'Microsoft-Windows-Subsystem-Linux','VirtualMachinePlatform','Microsoft-Hyper-V','Containers') {
            $s = Get-WindowsOptionalFeature -Online -FeatureName $f -ErrorAction SilentlyContinue
            "$f : $($s.State)"
          }
      - name: desktop
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen $($b.Width)x$($b.Height)"
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(123, 77)
          "cursor after set: $([System.Windows.Forms.Cursor]::Position)"
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $colors = @{}
          for ($x = 0; $x -lt $b.Width; $x += 37) { for ($y = 0; $y -lt $b.Height; $y += 37) { $colors[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
          "screenshot: $($colors.Count) distinct colours on a 37 px grid"
      - name: openssh server on localhost
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            "sshd not installed: adding the capability"
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-String
          }
          Start-Service sshd; (Get-Service sshd).Status
          cmd /c 'ssh-keygen -q -t ed25519 -N "" -f %RUNNER_TEMP%\probe_key'
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$env:RUNNER_TEMP\probe_key.pub" | Set-Content $auth
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          ssh -i "$env:RUNNER_TEMP\probe_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$env:USERNAME@localhost" "echo ssh-ok && ver"
          "exit=$LASTEXITCODE"
      - name: wsl
        continue-on-error: true
        timeout-minutes: 25
        env:
          WSL_UTF8: '1'
        run: |
          wsl --version; "version exit=$LASTEXITCODE"
          wsl --status; "status exit=$LASTEXITCODE"
          wsl --install Ubuntu-24.04 --no-launch --web-download; "install exit=$LASTEXITCODE"
          wsl -l -v; "list exit=$LASTEXITCODE"
          wsl -d Ubuntu-24.04 -u root -- sh -c 'uname -a; cat /proc/version'; "wsl2 run exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) {
            wsl --set-version Ubuntu-24.04 1; "set-version 1 exit=$LASTEXITCODE"
            wsl -d Ubuntu-24.04 -u root -- sh -c 'uname -a'; "wsl1 run exit=$LASTEXITCODE"
            wsl -l -v
          }
      - name: vscodium
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $zip = "VSCodium-win32-x64-$env:TAG.zip"
          Invoke-WebRequest "$env:RELEASES/$env:TAG/$zip" -OutFile "$env:RUNNER_TEMP\$zip"
          Invoke-WebRequest "$env:RELEASES/$env:TAG/$zip.sha256" -OutFile "$env:RUNNER_TEMP\$zip.sha256"
          $want = ((Get-Content "$env:RUNNER_TEMP\$zip.sha256" -Raw) -split '\s+')[0]
          $got = (Get-FileHash "$env:RUNNER_TEMP\$zip" -Algorithm SHA256).Hash
          "sha256 matches: $($want -ieq $got)"
          $dir = "$env:RUNNER_TEMP\codium"
          Expand-Archive "$env:RUNNER_TEMP\$zip" $dir
          Get-ChildItem "$dir\bin" | ForEach-Object Name
          $cli = Get-ChildItem "$dir\bin" -Filter *.cmd | Select-Object -First 1
          & $cli.FullName --version
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'unins' | Select-Object -First 1
          "exe: $($exe.Name)"
          $p = Start-Process $exe.FullName -PassThru -ArgumentList '--remote-debugging-port=9333', "--user-data-dir=$env:RUNNER_TEMP\ud", "--extensions-dir=$env:RUNNER_TEMP\ext", '--new-window'
          $up = $null
          for ($i = 0; $i -lt 90 -and -not $up; $i++) { Start-Sleep 1; try { $up = Invoke-RestMethod http://127.0.0.1:9333/json/version } catch {} }
          if ($up) { "CDP up after ${i}s: $($up.Browser)"; (Invoke-RestMethod http://127.0.0.1:9333/json/list) | ForEach-Object { "page: $($_.type) $($_.title)" } } else { "CDP never answered" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $colors = @{}
          for ($x = 0; $x -lt $b.Width; $x += 37) { for ($y = 0; $y -lt $b.Height; $y += 37) { $colors[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
          "screenshot with the editor open: $($colors.Count) distinct colours"
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.ProcessName) '$($_.MainWindowTitle)'" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

  macos:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-14, macos-15-intel]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - name: machine
        run: |
          sw_vers; uname -m
          sysctl -n machdep.cpu.brand_string; echo "cpus=$(sysctl -n hw.ncpu) memGB=$(( $(sysctl -n hw.memsize) / 1073741824 ))"
          sysctl kern.hv_support kern.hv_vmm_present 2>&1 || true
          df -h / | tail -1
          node --version; ssh -V; which docker colima podman 2>&1 || true
      - name: sshd on localhost
        continue-on-error: true
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>&1 || sudo systemsetup -f -setremotelogin on 2>&1 || true
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/probe_key"
          mkdir -p ~/.ssh && cat "$RUNNER_TEMP/probe_key.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          ssh -i "$RUNNER_TEMP/probe_key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new localhost 'echo ssh-ok; uname -a'
      - name: gui permissions
        continue-on-error: true
        run: |
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          echo "--- TCC grants (system db)"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select client, service, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServicePostEvent','kTCCServiceAppleEvents')" 2>&1 | head -40 || true
          echo "--- screencapture"
          limit 30 screencapture -x "$RUNNER_TEMP/screen.png"; echo "exit=$?"; ls -l "$RUNNER_TEMP/screen.png" 2>&1
          echo "--- System Events process list"
          limit 60 osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1; echo "exit=$?"
          echo "--- keystroke into TextEdit"
          limit 60 osascript -e 'tell application "TextEdit" to activate' -e 'tell application "TextEdit" to make new document' -e 'delay 2' -e 'tell application "System Events" to keystroke "probe-typed"' -e 'delay 1' -e 'tell application "TextEdit" to get text of document 1' 2>&1; echo "exit=$?"
          limit 20 osascript -e 'tell application "TextEdit" to quit saving no' 2>&1 || true
      - name: vscodium
        continue-on-error: true
        timeout-minutes: 15
        run: |
          case "$(uname -m)" in arm64) arch=arm64;; *) arch=x64;; esac
          zip="VSCodium-darwin-$arch-$TAG.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "$RELEASES/$TAG/$zip"
          curl -fsSLo "$RUNNER_TEMP/$zip.sha256" "$RELEASES/$TAG/$zip.sha256"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c "$zip.sha256") || { echo "sha256 file:"; cat "$RUNNER_TEMP/$zip.sha256"; shasum -a 256 "$RUNNER_TEMP/$zip"; }
          mkdir -p "$RUNNER_TEMP/codium" && ditto -x -k "$RUNNER_TEMP/$zip" "$RUNNER_TEMP/codium"
          app=$(ls -d "$RUNNER_TEMP"/codium/*.app | head -1); echo "app: $app"; ls "$app/Contents/MacOS"
          "$app/Contents/Resources/app/bin/"codium* --version
          bin=$(ls "$app/Contents/MacOS"/* | head -1)
          "$bin" --remote-debugging-port=9333 --user-data-dir="$RUNNER_TEMP/ud" --extensions-dir="$RUNNER_TEMP/ext" --new-window >"$RUNNER_TEMP/codium.log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do sleep 1; v=$(curl -fs http://127.0.0.1:9333/json/version) && break; done
          if [ -n "$v" ]; then echo "CDP up after ${i}s: $v" | head -3; curl -fs http://127.0.0.1:9333/json/list | grep -E '"(type|title)"'; else echo "CDP never answered"; tail -20 "$RUNNER_TEMP/codium.log"; fi
          kill "$pid" 2>/dev/null || true
      - name: docker through colima
        if: matrix.image != 'macos-14'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          brew install colima docker >/dev/null 2>&1; echo "brew exit=$?"
          perl -e 'alarm shift; exec @ARGV' 600 colima start --cpu 2 --memory 4 2>&1 | tail -15
          docker info --format '{{.ServerVersion}} {{.OSType}}/{{.Architecture}}' 2>&1
