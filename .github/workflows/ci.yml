name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 5
    strategy:
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - run: |
          echo "runner=$RUNNER_NAME host=$(hostname) up=$(cut -d' ' -f1 /proc/uptime)"
          echo "--- editors and displays"; ps -eo pid,ppid,etime,user,args --sort=etime | grep -iE 'codium|/code |electron|Xvfb|xvfb-run|harness|mocha' | grep -v grep | cut -c1-220 || true
          echo "--- containers"; docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | head -20
          echo "--- listening"; ss -ltnp 2>/dev/null | head -25
          echo "--- tmp sockets"; ls -la /tmp | grep -iE 'vscode|codium|ipc|sock' | head -20
          echo "--- memory"; free -m; cat /sys/fs/cgroup/memory.max
          echo "--- hosts tail"; tail -5 /etc/hosts
          sleep 30
