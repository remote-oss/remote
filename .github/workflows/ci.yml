# Layout, typecheck, lint, format and unit tests (ADR-0002). Manual trigger until the testing ADR states the CI cost,
# so the private repository uses no Actions minutes by default.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # the version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-layout
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit

  # build:        bundle and package each extension, fail on node_modules in a VSIX, after the packaging ADR
  # integration:  pnpm test:integration under xvfb, after the testing ADR
  # licences:     dependency licence check (ADR-0002, decision 8), follow-up
  # conformance:  per package and profile, runner in tests/conformance/runner, after the testing ADR
