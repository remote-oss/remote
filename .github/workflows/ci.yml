# A probe of the self-hosted runners' memory limits: never merged.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ fromJSON(format('["{0}","X64"]', vars.CI_RUNS_ON)) }}
    timeout-minutes: 5
    steps:
      - run: |
          echo "runner=$RUNNER_NAME max=$(cat /sys/fs/cgroup/memory.max) current=$(cat /sys/fs/cgroup/memory.current) swapmax=$(cat /sys/fs/cgroup/memory.swap.max 2>/dev/null) oom=$(awk '/^oom_kill /{print $2}' /sys/fs/cgroup/memory.events)"
          free -m | head -2
          sleep 45
