# VSCodium job.
name: acceptance-launches

on:
  workflow_call:
    inputs:
      full:
        description: Whether the pull request carries the acceptance-full label
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  select:
    # a git diff and the launch table only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      launches: ${{ steps.select.outputs.launches }}
      minutes: ${{ steps.select.outputs.minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ inputs.full }}
        run: |
          plan=$(node tools/acceptance-select.ts --base "$BASE" --head "$HEAD" --pull-request $([ "$FULL" = true ] && echo --full))
          echo "plan: $plan"
          notice=$(printf '%s' "$plan" | jq -r '.notice // empty')
          if [ -n "$notice" ]; then
            echo "::notice title=VSCodium launches::$notice"
            printf '%s\n' "**VSCodium launches:** $notice" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "launches=$(printf '%s' "$plan" | jq -r '.launches')" >> "$GITHUB_OUTPUT"
          echo "minutes=$(printf '%s' "$plan" | jq -r '.minutes')" >> "$GITHUB_OUTPUT"

  run:
    name: acceptance (vscodium, ${{ needs.select.outputs.launches }})
    needs: select
    if: needs.select.outputs.launches != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.select.outputs.minutes) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm acceptance:clean
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # the disk the containers launches' images need, and rootless Podman for the containers-podman launch, as ci.yml's
      # VSCodium job sets them up
      - if: contains(needs.select.outputs.launches, 'containers')
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - if: contains(needs.select.outputs.launches, 'containers-podman')
        run: tools/install-podman
      # the display the rows are written against: :99 at 1920x1080 with a window manager (tools/start-display)
      - run: tools/start-display
      - run: pnpm test:acceptance:vscodium --launches "$LAUNCHES"
        env:
          LAUNCHES: ${{ needs.select.outputs.launches }}
      - if: always()
        run: df -h / | tail -1 && docker system df
      - if: always()
        run: pnpm acceptance:clean
