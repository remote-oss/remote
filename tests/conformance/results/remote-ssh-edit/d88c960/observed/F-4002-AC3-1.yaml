expect:
  first-keystrokes:
    suggest:active@5:1:
      items:
        - order: 0
          label: ForwardAgent
          kind: symbol-property
          preselected: true
          documentation:
            "Specifies whether the connection to the authentication agent (if any) will be forwarded to the remote
            machine. The argument must be ``yes'' or ``no .'' The default is ``no .''

            Agent forwarding should be enabled with caution. Users with the ability to bypass file permissions on the remote
            host (for the agent's Unix-domain socket) can access the local agent through the forwarded connection. attacker
            cannot obtain key material from the agent, however they can perform operations on the keys that enable them to authenticate
            using the identities loaded into the agent."
        - order: 1
          label: ForwardX11
          kind: symbol-property
          preselected: false
          documentation:
            "Specifies whether X11 connections will be automatically redirected over the secure channel and DISPLAY
            set. The argument must be ``yes'' or ``no .'' The default is ``no .''

            X11 forwarding should be enabled with caution. Users with the ability to bypass file permissions on the remote host
            (for the user's X11 authorization database) can access the local X11 display through the forwarded connection.
            attacker may then be able to perform activities such as keystroke monitoring if the ForwardX11Trusted option is
            also enabled."
        - order: 2
          label: ForwardX11Timeout
          kind: symbol-property
          preselected: false
          documentation:
            Specify a timeout for untrusted X11 forwarding using the format described in the TIME FORMATS section
            of sshd_config(5). X11 connections received by ssh(1) after this time will be refused. The default is to disable
            untrusted X11 forwarding after twenty minutes has elapsed.
        - order: 3
          label: ForwardX11Trusted
          kind: symbol-property
          preselected: false
          documentation:
            "If this option is set to ``yes ,'' remote X11 clients will have full access to the original X11
            display.

            If this option is set to ``no ,'' remote X11 clients will be considered untrusted and prevented from stealing
            or tampering with data belonging to trusted X11 clients. Furthermore, the xauth(1) token used for the session will
            be set to expire after 20 minutes. Remote clients will be refused access after this time.

            The default is ``no .''

            See the X11 SECURITY extension specification for full details on the restrictions imposed on untrusted clients."
        - order: 4
          label: LocalForward
          kind: symbol-property
          preselected: false
          documentation:
            "Specifies that a TCP port on the local machine be forwarded over the secure channel to the specified
            host and port from the remote machine. The first argument must be off [ on and the second argument must be host
            : hostport . IPv6 addresses can be specified by enclosing addresses in square brackets. Multiple forwardings may
            be specified, and additional forwardings can be given on the command line. Only the superuser can forward privileged
            ports. By default, the local port is bound in accordance with the GatewayPorts setting. However, an explicit bind_address
            may be used to bind the connection to a specific address. The bind_address of ``localhost'' indicates that the
            listening port be bound for local use only, while an empty address or `*' indicates that the port should be available
            from all interfaces."
        - order: 5
          label: ExitOnForwardFailure
          kind: symbol-property
          preselected: false
          documentation:
            Specifies whether ssh(1) should terminate the connection if it cannot set up all requested dynamic,
            tunnel, local, and remote port forwardings. The argument must be ``yes'' or ``no .'' The default is ``no .''
        - order: 6
          label: RemoteForward
          kind: symbol-property
          preselected: false
          documentation:
            "Specifies that a TCP port on the remote machine be forwarded over the secure channel to the specified
            host and port from the local machine. The first argument must be off [ on and the second argument must be host :
            hostport . IPv6 addresses can be specified by enclosing addresses in square brackets. Multiple forwardings may be
            specified, and additional forwardings can be given on the command line. Privileged ports can be forwarded only when
            logging in as root on the remote machine.

            If the port argument is `0 ,' the listen port will be dynamically allocated on the server and reported to the client
            at run time.

            If the bind_address is not specified, the default is to only bind to loopback addresses. If the bind_address is
            `*' or an empty string, then the forwarding is requested to listen on all interfaces. Specifying a remote bind_address
            will only succeed if the server's GatewayPorts option is enabled (see sshd_config(5)) ."
        - order: 7
          label: DynamicForward
          kind: symbol-property
          preselected: false
          documentation:
            "Specifies that a TCP port on the local machine be forwarded over the secure channel, and the application
            protocol is then used to determine where to connect to from the remote machine.

            The argument must be off [ on IPv6 addresses can be specified by enclosing addresses in square brackets. By default,
            the local port is bound in accordance with the GatewayPorts setting. However, an explicit bind_address may be used
            to bind the connection to a specific address. The bind_address of ``localhost'' indicates that the listening port
            be bound for local use only, while an empty address or `*' indicates that the port should be available from all
            interfaces.

            Currently the SOCKS4 and SOCKS5 protocols are supported, and ssh(1) will act as a SOCKS server. Multiple forwardings
            may be specified, and additional forwardings can be given on the command line. Only the superuser can forward privileged
            ports."
        - order: 8
          label: ClearAllForwardings
          kind: symbol-property
          preselected: false
          documentation:
            Specifies that all local, remote, and dynamic port forwardings specified in the configuration files
            or on the command line be cleared. This option is primarily useful when used from the ssh(1) command line to clear
            port forwardings set in configuration files, and is automatically set by scp(1) and sftp(1). The argument must be
            ``yes'' or ``no .'' The default is ``no .''
