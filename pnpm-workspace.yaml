packages:
  - packages/*
  - tests/acceptance
  - tests/tunnels-conformance

# esbuild's install script only checks that its platform binary is present.
allowBuilds:
  esbuild: true
  # vsce stores publishing tokens with keytar; packaging never uses it, so its native build is not run.
  keytar: false
  # websocket's two native addons: the tunnel agent's bundle leaves them out (ADR-0016), so their builds are not run.
  bufferutil: false
  utf-8-validate: false
  # es5-ext's postinstall only prints a message.
  es5-ext: false
